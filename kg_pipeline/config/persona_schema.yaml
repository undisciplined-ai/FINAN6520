node_types:
  CharacterTrait:
    code: "CDT"
    description: "Observable personality characteristic, habit, or disposition"
    fields:
      trait_type: enum[behavioral, cognitive, emotional, social]
      manifestation: string
      intensity: float
      consistency: enum[always, usually, situational, rare]
  Value:
    code: "VAL"
    description: "Prescriptive principle with behavioral directive"
    fields:
      principle: string
      behavioral_directive: string
      application_context: string
      strength: float
      polarity: enum[positive, caution, taboo]
  Drive:
    code: "DRV"
    description: "Goals, motivations, conflicts, and stakes"
    fields:
      goal_description: string
      goal_type: enum[external, internal]
      motivation: string
      active_conflict: string
      stakes: string
      priority: float
  ReasoningPattern:
    code: "REA"
    description: "Decision template with trigger and response"
    fields:
      trigger: string
      preferred_response: string
      failure_mode: string
      confidence_level: float
  LinguisticStyle:
    code: "LIN"
    description: "Communication preferences with affect modulation"
    fields:
      formality: enum[casual, professional, academic]
      complexity: enum[simple, moderate, technical]
      directness: enum[direct, indirect, adaptive]
      verbosity: enum[terse, balanced, expansive]
      example_phrases: list[string]
      affect_modulation: string

edge_types:
  - name: "causes"
    description: "Source influences, triggers, or motivates target. Asymmetric causality."
  - name: "conflicts_with"
    description: "Source opposes, blocks, or creates tension with target"
  - name: "evidences"
    description: "Source is observable proof or manifestation of target"
  - name: "reinforces"
    description: "Source strengthens, amplifies, or supports target"

# Common fields for all nodes
node_common_fields:
  - id: string           # Auto-generated: doc-page-chunk-type-seq
  - type: string         # One of node_types above
  - label: string        # Brief concept label
  - description: string  # Clear description
  - reasoning_inspiration: optional[string]  # Optional meta-cognitive summary of what in the text inspired this node
  - tags: list[string]   # Categorization
  - importance: float    # 0.0-1.0
  - jungian_traits:      # Jungian trait tags from controlled vocabulary (at least one required)
      desires: list[string]      # Core desires evident in node
      fears: list[string]        # Core fears evident in node
      strategies: list[string]   # Strategies evident in node
      talents: list[string]      # Talents/strengths evident in node
      weaknesses: list[string]   # Shadow traits/weaknesses evident in node
      themes: list[string]       # High-level thematic keywords
  - provenance:
      doc_id: string
      doc_name: string
      page_num: int
      chunk_id: string
      extraction_phase: string

# Common fields for all edges
edge_common_fields:
  - source_id: string
  - target_id: string
  - relation: string     # One of edge_types above
  - weight: float        # 0.0-1.0
  - confidence: float    # 0.0-1.0
  - evidence: string     # Optional quote/reference
