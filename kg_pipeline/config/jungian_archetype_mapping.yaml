# Jungian Archetype Mapping
#
# Defines the 12 Jungian archetypes, their trait signatures, and cardinal orientations.
# This mapping allows downstream phases to score nodes against archetypes based on their
# jungian_traits tags without requiring LLMs to make categorical judgments during extraction.
#
# Usage:
# - Phase 2.5: Use trait overlap to improve entity resolution clustering
# - Phase 4: Filter nodes by archetype alignment for persona assembly
# - Analytics: Generate coverage reports showing archetype representation in corpus

version: "1.0"

# Four Cardinal Orientations organize the 12 archetypes
cardinal_orientations:
  ego:
    label: "Ego"
    description: "Leave a Mark on the World"
    archetypes: ["Innocent", "Hero", "Magician"]
  
  order:
    label: "Order"
    description: "Provide Structure to the World"
    archetypes: ["Caregiver", "Ruler", "Creator"]
  
  social:
    label: "Social"
    description: "Connect to Others"
    archetypes: ["Everyman", "Lover", "Jester"]
  
  freedom:
    label: "Freedom"
    description: "Yearn for Paradise"
    archetypes: ["Explorer", "Sage", "Rebel"]

# The 12 Jungian Archetypes with their trait signatures
archetypes:
  
  Innocent:
    orientation: "ego"
    motto: "Free to be you and me"
    core_description: "Seeks happiness and safety through optimism and doing what's right"
    trait_signature:
      desires: ["paradise"]
      fears: ["punishment"]
      strategies: ["do_things_right"]
      talents: ["faith_optimism"]
      weaknesses: ["naive_boring"]
      themes: ["safety"]
    
  Everyman:
    orientation: "social"
    motto: "All men and women are created equal"
    core_description: "Seeks belonging through solid virtues and authentic connection"
    trait_signature:
      desires: ["belonging"]
      fears: ["exclusion"]
      strategies: ["develop_solid_virtues"]
      talents: ["realism_empathy"]
      weaknesses: ["losing_self_to_blend_in"]
      themes: ["belonging"]
  
  Hero:
    orientation: "ego"
    motto: "Where there's a will, there's a way"
    core_description: "Proves worth through courageous acts and mastery"
    trait_signature:
      desires: ["prove_worth"]
      fears: ["weakness_vulnerability"]
      strategies: ["be_strong_competent"]
      talents: ["competence_courage"]
      weaknesses: ["arrogance_always_fighting"]
      themes: ["mastery", "power"]
  
  Caregiver:
    orientation: "order"
    motto: "Love your neighbour as yourself"
    core_description: "Protects and nurtures others through compassionate service"
    trait_signature:
      desires: ["protect_others"]
      fears: ["selfishness_ingratitude"]
      strategies: ["do_things_for_others"]
      talents: ["compassion_generosity"]
      weaknesses: ["martyrdom_exploitation"]
      themes: ["service"]
  
  Explorer:
    orientation: "freedom"
    motto: "Don't fence me in"
    core_description: "Seeks authentic self through freedom and new experiences"
    trait_signature:
      desires: ["freedom_to_explore"]
      fears: ["trapped_conformity"]
      strategies: ["journey_seek_experience"]
      talents: ["autonomy_ambition"]
      weaknesses: ["aimless_wandering"]
      themes: ["liberation"]
  
  Rebel:
    orientation: "freedom"
    motto: "Rules are made to be broken"
    core_description: "Overturns broken systems through radical disruption"
    trait_signature:
      desires: ["revenge_revolution"]
      fears: ["powerlessness"]
      strategies: ["disrupt_destroy_shock"]
      talents: ["outrageousness_radical_freedom"]
      weaknesses: ["crossing_to_dark_side"]
      themes: ["liberation", "power"]
  
  Lover:
    orientation: "social"
    motto: "You're the only one"
    core_description: "Seeks intimacy and deep connection through presence and passion"
    trait_signature:
      desires: ["intimacy_experience"]
      fears: ["being_alone_unwanted"]
      strategies: ["become_attractive"]
      talents: ["passion_commitment"]
      weaknesses: ["losing_identity_to_please"]
      themes: ["intimacy", "pleasure"]
  
  Creator:
    orientation: "order"
    motto: "If you can imagine it, it can be done"
    core_description: "Builds enduring value through vision and craft"
    trait_signature:
      desires: ["create_enduring_value"]
      fears: ["mediocrity"]
      strategies: ["develop_artistic_skill"]
      talents: ["creativity_imagination"]
      weaknesses: ["perfectionism"]
      themes: ["innovation"]
  
  Jester:
    orientation: "social"
    motto: "You only live once"
    core_description: "Lives fully in the moment through joy and playfulness"
    trait_signature:
      desires: ["live_in_moment"]
      fears: ["boredom"]
      strategies: ["play_make_jokes"]
      talents: ["joy"]
      weaknesses: ["frivolity_wasting_time"]
      themes: ["pleasure"]
  
  Sage:
    orientation: "freedom"
    motto: "The truth will set you free"
    core_description: "Seeks understanding through analysis and wisdom"
    trait_signature:
      desires: ["find_truth"]
      fears: ["being_duped_ignorance"]
      strategies: ["seek_information_knowledge"]
      talents: ["wisdom_intelligence"]
      weaknesses: ["analysis_paralysis"]
      themes: ["knowledge"]
  
  Magician:
    orientation: "ego"
    motto: "I make things happen"
    core_description: "Transforms reality by understanding fundamental laws"
    trait_signature:
      desires: ["understand_fundamental_laws"]
      fears: ["unintended_consequences"]
      strategies: ["develop_vision_live_by_it"]
      talents: ["finding_win_win_solutions"]
      weaknesses: ["becoming_manipulative"]
      themes: ["power", "mastery"]
  
  Ruler:
    orientation: "order"
    motto: "Power isn't everything, it's the only thing"
    core_description: "Creates prosperity through control and leadership"
    trait_signature:
      desires: ["control"]
      fears: ["chaos_being_overthrown"]
      strategies: ["exercise_power"]
      talents: ["responsibility_leadership"]
      weaknesses: ["authoritarian_unable_to_delegate"]
      themes: ["control", "power"]

# Scoring Guidelines
# 
# To compute archetype affinity for a node:
# 1. Count overlapping traits between node.jungian_traits and archetype.trait_signature
# 2. Weight by category (desires/fears weighted higher than themes)
# 3. Normalize by total possible overlap to get confidence score (0.0-1.0)
# 4. Assign top 1-2 archetypes with confidence ≥ 0.6
#
# Example scoring weights:
#   desires: 3.0
#   fears: 3.0
#   strategies: 2.0
#   talents: 2.0
#   weaknesses: 1.5
#   themes: 1.0
