# Knowledge Graph Export Schema (GraphRAG-Friendly)
# ------------------------------------------------
# Defines how to convert canonical nodes (`outputs/nodes_canonical.jsonl`)
# and relationships (`outputs/edges.jsonl`) into the standardized JSONL
# format expected by GraphRAG-style retrieval pipelines.
#
# Files produced by the exporter:
#   - outputs/entities.jsonl        (node records)
#   - outputs/relationships.jsonl   (edge records)
#
# Each entity/relationship entry is a single JSON object per line so the
# resulting files can be streamed directly into vector stores or toolchains
# like Neo4j, NetworkX, LangChain GraphRAG, etc.

version: "1.0"

entity_schema:
  output_file: "outputs/entities.jsonl"
  source_file: "outputs/nodes_canonical.jsonl"
  required_fields:
    id: "Node ID (doc###-p###-c##-TYPE-##)"
    title: "Node label"
    type: "One of [CharacterTrait, Value, Drive, ReasoningPattern, LinguisticStyle]"
    description: "Synthesis of the concept"
    source_id: "Document identifier (doc###)"
    attributes:
      importance: "Float 0-1, used for sampling"
      tags: "Optional free-form tags"
      jungian_traits:
        desires: []
        fears: []
        strategies: []
        talents: []
        weaknesses: []
        themes: []
      provenance:
        chunk_id: "c##"
        page_num: "int"
  mapping_notes:
    - "title        <- node.label"
    - "description  <- node.description"
    - "source_id    <- first provenance entry doc_id"
    - "attributes.jungian_traits categories mirror persona_schema.yaml"

relationship_schema:
  output_file: "outputs/relationships.jsonl"
  source_file: "outputs/edges.jsonl"
  required_fields:
    source: "source node id"
    target: "target node id"
    relationship: "causes | conflicts_with | evidences | reinforces"
    description: "Conceptual rationale connecting the nodes"
    weight: "Float 0-1"
    confidence: "Float 0-1"
    source_id: "doc### for provenance"
  mapping_notes:
    - "description <- edge.evidence (now conceptual)"
    - "source_id   <- doc id inferred from source node id prefix"

archetype_query_support:
  dependencies:
    - "config/jungian_traits.yaml"
    - "config/jungian_archetype_mapping.yaml"
  trait_weighting:
    desires: 3.0
    fears: 3.0
    strategies: 2.0
    talents: 2.0
    weaknesses: 1.5
    themes: 1.0
  query_steps:
    - "Look up requested archetype in jungian_archetype_mapping.yaml to obtain trait signature and cardinal orientation"
    - "Score every entity's jungian_traits against the signature using the weights above"
    - "Filter entities whose normalized score >= 0.6 (or return top-k)"
    - "Collect all relationships where both endpoints are in the filtered set"
    - "Return the induced subgraph for GraphRAG answering"
  llm_contract:
    instructions: |
      Given an archetype request (e.g., "Ruler"), load its trait signature,
      score node candidates by weighted trait overlap, and provide the
      highest-scoring concepts plus their connecting relationships. Do not
      rename or relabel nodes—ground responses in the exported entity titles
      and conceptual relationship rationales.
  outputs:
    - "Top archetype-aligned nodes (id, title, description, score)"
    - "Supporting relationships (source, target, relationship, description)"
    - "Cardinal orientation summary (ego | order | social | freedom)"
